name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'web_app/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'web_app/frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build-lint-test:
    name: Frontend Build, Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web_app/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web_app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run TypeScript type check
        run: npx tsc -b

      - name: Run ESLint
        run: npm run lint

      - name: Run production build
        run: npm run build
