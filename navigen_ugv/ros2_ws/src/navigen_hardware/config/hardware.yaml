motor_controller_bridge:
  ros__parameters:
    # Set true for development/CI. The mock mirrors encoderless open-loop hardware.
    mock_hardware: false
    # Real launch keeps propulsion inhibited until an operator explicitly publishes false.
    start_with_software_estop: true
    serial_port: /dev/ttyUSB0
    baud_rate: 115200
    reconnect_interval_s: 1.0
    command_rate_hz: 30.0
    telemetry_poll_rate_hz: 50.0
    command_timeout_s: 0.20
    telemetry_timeout_s: 0.25
    firmware_watchdog_timeout_s: 0.30
    require_open_loop_mode: true
    mock_battery_voltage: 12.0
    mock_ultrasonic_left: 2.5
    mock_ultrasonic_right: -1.0
    mock_max_pwm: 255

    # Safe simulation defaults only; replace with measured physical values together with
    # navigen_description/config/vehicle.yaml and firmware/include/board_config.h.
    wheel_radius: 0.0625
    track_width: 0.34
    # Encoderless physical defaults are deliberately slower than the 0.4 m/s project cap.
    max_linear_velocity: 0.15
    max_angular_velocity: 0.50
    max_wheel_velocity: 0.20
    max_linear_acceleration: 0.30
    max_angular_acceleration: 0.80

    base_frame: base_link
    ultrasonic_left_frame: ultrasonic_left_link
    ultrasonic_right_frame: ultrasonic_right_link
    ultrasonic_min_range: 0.02
    ultrasonic_max_range: 4.0
    ultrasonic_field_of_view: 0.26
