# Single source of truth for vehicle geometry and static sensor transforms.
# IMPORTANT: these are safe SIMULATION DEFAULTS, not measured physical-UGV calibration.
# Before real operation, measure every value below and record the measurements in the
# calibration log. Keep wheel radius / track width synchronized with hardware.yaml and
# firmware board_config.h. No value in this file is a GPS input.
profile: simulation_default
chassis:
  length: 0.40        # [m]
  width: 0.30         # [m]
  height: 0.12        # [m]
  mass: 4.0           # [kg]
wheel:
  radius: 0.0625      # [m]
  width: 0.045        # [m]
  mass: 0.35          # [kg]
track_width: 0.34     # [m] left-right wheel center distance (effective, see docs/calibration.md)
wheel_base: 0.26      # [m] front-rear axle distance
ground_clearance: 0.035  # [m] chassis bottom above ground
camera:
  x: 0.17               # [m] forward of base_link origin
  y: 0.0                # [m] left of base_link origin
  z_above_chassis: 0.10 # [m] above chassis top
  roll: 0.0             # [rad]
  pitch: 0.15           # [rad] downward tilt
  yaw: 0.0              # [rad]
imu:
  x: 0.0
  y: 0.0
  z: 0.03               # [m] above chassis top
  roll: 0.0
  pitch: 0.0
  yaw: 0.0
ultrasonic:
  x: 0.20               # [m] forward of base_link origin
  y_offset: 0.10        # [m] lateral offset of each front sensor
  z: 0.04               # [m] above chassis bottom
  roll: 0.0
  pitch: 0.0
  left_yaw: 0.0
  right_yaw: 0.0
